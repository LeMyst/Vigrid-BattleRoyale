//--- Binarize keeps a named selection as a retexturable section ONLY if it is listed here: without
//--- this, SetObjectTexture on BR_GroundSegment's "camo" runs and silently changes nothing.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class zone: Default {};

	class ground_segment: Default
	{
		sections[] = {"camo"};
	};
};
