WorkDrive=P:\
ModBuildDirectory=P:\Mods\
KeyDirectory=P:\Keys\
KeyName=BattleRoyale
GameDirectory=C:\Games\steamapps\common\DayZ\
ServerDirectory=C:\Games\steamapps\common\DayZServer\
ServerPassword=
SPMission=.\Missions\empty.ChernarusPlus
MPMission=.\MPMissions\empty.ChernarusPlus
ServerProfileDirectory=C:\Games\steamapps\common\DayZServer\ServerProfile\
ServerConfig=C:\Games\steamapps\common\DayZServer\ServerProfile\serverDZ.cfg
Port=2303
# Set to 1 to keep "storage_*" between server launches. Skips the cold Central Economy loot spawn,
# which is over half of boot time. Off by default - with storage kept, players rejoin their
# persisted character and vehicles stay where the last run left them.
KeepStorage=0
# Set to 1 to launch under the Goldberg Steam emulator, which writes an account name and Steam ID
# into %APPDATA%\Goldberg SteamEmu Saves\settings before every launch. That is what gives each
# local client a distinct Steam identity; without it several clients share one and kick each other,
# so LaunchLocalMP.bat with 2 or 3 clients needs this. project.cfg defaults it to 0, since it is
# unrelated to building the mod and this repo is public; this sample turns it ON for LaunchLocalMP.
# One client at a time works fine either way.
UseSteamEmu=1
# Set to 1 to copy the prebuilt third-party PBOs in Workbench\ExtraPBOs into the built mod folder.
# project.cfg defaults it to 0 so that a clone builds the same mod as everyone else - that folder is
# gitignored, so its contents differ per machine. This sample turns it ON, as the maintainer runs;
# a fresh clone's folder holds no PBO, so it copies nothing. Read Workbench\ExtraPBOs\README.md first.
CopyExtraPBOs=1
ClientEXE=DayZDiag_x64.exe
ServerEXE=DayZDiag_x64.exe
# Retail-executable mode. Leave ReleaseEXE at 0 and reach for it per launch instead:
#     Release.bat LaunchServer.bat
#     Release.bat LaunchLocalMP.bat 2
# Everything below only matters in that mode. The diag exe lives in the client install and is
# usually what ServerDirectory points at, so the retail SERVER exe is often somewhere else -
# ReleaseServerDirectory overrides ServerDirectory for release launches only. Both directory
# overrides are optional; leave them out to reuse GameDirectory / ServerDirectory.
# -newErrorsAreWarnings=1 and -filePatching are stripped automatically, so leave them below.
#ReleaseEXE=1
#ReleaseServerDirectory=C:\Games\steamapps\common\DayZServer\
ServerLaunchParams=-adminlog -server "-newErrorsAreWarnings=1"
ClientLaunchParams=-adminlog "-newErrorsAreWarnings=1"
ClientProfileDirectory=F:\Temp\SClientAProfile\
ClientBProfileDirectory=F:\Temp\SClientBProfile\
ClientCProfileDirectory=F:\Temp\SClientCProfile\
PlayerName=Client_A
PlayerBName=Client_B
PlayerCName=Client_C
# Placeholders: any three distinct SteamID64s. With UseSteamEmu=1 each local client presents its own.
PlayerSteamID=76561198000000001
PlayerBSteamID=76561198000000002
PlayerCSteamID=76561198000000003
# @Vigrid-BattleRoyale LAST: -mod= order is what loads it after Expansion, as in project.cfg.
AdditionalMPMods=@CF;@Dabs Framework;@Community-Online-Tools;@DayZ-Expansion-Licensed;@DayZ-Expansion-Bundle;@DayZ-Expansion-Animations;@Vehicle3PP;@Vigrid-BattleRoyale
AdditionalSPMods=@CF;@Dabs Framework;@Community-Online-Tools;@DayZ-Expansion-Licensed;@DayZ-Expansion-Bundle;@DayZ-Expansion-Animations;@Vehicle3PP;@Vigrid-BattleRoyale
