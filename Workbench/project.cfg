ModName=@Vigrid-BattleRoyale
AdditionalMPMods=@CF;@Dabs Framework;@Community-Online-Tools;@DayZ-Expansion-Licensed;@DayZ-Expansion-Bundle;@DayZ-Expansion-Animations;@Vigrid-BattleRoyale;
AdditionalSPMods=@CF;@Dabs Framework;@Community-Online-Tools;@DayZ-Expansion-Licensed;@DayZ-Expansion-Bundle;@DayZ-Expansion-Animations;@Vigrid-BattleRoyale;
ServerPassword=
Port=2302
PrefixLinkRoot=Vigrid-BattleRoyale
ClientEXE=DayZDiag_x64.exe
ServerEXE=DayZDiag_x64.exe
# The retail executables, used only when ReleaseEXE=1 or BR_RELEASE=1 - see Batchfiles\Release.bat.
# The diag exe demotes errors a real server treats as fatal (and does not log them at all), so a
# retail boot is the only local way to prove a config.cpp / requiredAddons change actually loads.
ReleaseEXE=0
ReleaseClientEXE=DayZ_x64.exe
ReleaseServerEXE=DayZServer_x64.exe
WorkbenchEXE=workbenchApp.exe
ServerLaunchParams=-server -doLogs -adminLog -freezeCheck
ClientLaunchParams=-exe DayZ_x64.exe -doLogs -noPause -freezeCheck
WorkbenchLaunchParams=-filePatching
KeepStorage=0
# Both of the following are OPT-IN and default off, so a fresh clone builds and launches
# without them. Set them in the gitignored Workbench\user.cfg, not here.
# UseSteamEmu=1 writes Goldberg Steam emulator identity files on every launch, which is what
# lets several local clients hold distinct Steam identities instead of kicking each other.
UseSteamEmu=0
# CopyExtraPBOs=1 copies the third-party PBOs in Workbench\ExtraPBOs into the built mod.
# Off by default so the build is reproducible across machines - see that folder's README.
CopyExtraPBOs=0
ScriptsPrefix=Scripts
GUIPrefix=GUI
PlayerName=PlayerName
KeyName=KeyName
